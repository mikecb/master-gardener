get_garden:
  name: Get garden
  description: Return the whole garden at a glance - climate and frost dates and where they came from, this year's budget, the seed on hand, every garden area with its style, light, size, character, neighbours, planting and task counts and soil state, plus the care profiles and plant catalogue status. Start here.

list_tasks:
  name: List tasks
  description: Return garden tasks with their ids - what is due or overdue now, or what is coming up.
  fields:
    area:
      name: Garden area
      description: Area name or id. Leave empty for the whole property.
      selector:
        device:
          integration: master_gardener
    show:
      name: Show
      description: due is everything to do now, including overdue. upcoming is what starts within the next days. all is both.
      default: due
      selector:
        select:
          options:
            - due
            - upcoming
            - all
    days:
      name: Days ahead
      description: How far ahead upcoming looks.
      default: 30
      selector:
        number:
          min: 1
          max: 400
          mode: box

complete_task:
  name: Complete task
  description: Record that a task was done. Completing a planting task also records the planting date. Completing a watering or fertilizing task hides it for a while, until the soil has had time to respond.
  fields:
    task_id:
      name: Task ID
      description: From the List tasks action.
      required: true
      selector:
        text:

add_planting:
  name: Add planting
  description: Record something growing, planned or proposed in a garden area. Plants found in the plant catalogue get their sowing, planting and harvest tasks scheduled automatically, and upkeep tasks from their care profile.
  fields:
    area:
      name: Garden area
      description: The area it grows in - its name or id.
      required: true
      selector:
        device:
          integration: master_gardener
    plant:
      name: Plant
      description: A plant id or exact name from the plant catalogue, e.g. tomato or cherokee-purple. Find ids with the Search plants action. A plant the catalogue does not know is tracked without automatic sowing and harvest tasks.
      required: true
      example: tomato
      selector:
        text:
    name:
      name: Name
      description: Your own name for it, e.g. the variety. Used in task titles.
      example: Cherokee Purple tomato
      selector:
        text:
    quantity:
      name: Quantity
      default: 1
      selector:
        number:
          min: 1
          max: 10000
          mode: box
    planted_on:
      name: Planted on
      description: When it went in the ground. Leave empty if it is only planned.
      selector:
        date:
    established:
      name: Established
      description: It has been in the ground for years and the date is not known. Stops a perennial's planting task from coming back each year.
      default: false
      selector:
        boolean:
    status:
      name: Status
      description: active is growing or about to be planted and gets tasks. planned is agreed but not yet bought - it waits in the build plan for its year and budget. proposed is a suggestion awaiting a decision. Neither planned nor proposed gets tasks until it becomes active.
      default: active
      selector:
        select:
          options:
            - active
            - planned
            - proposed
    estimated_cost:
      name: Estimated cost
      description: What buying the whole quantity is expected to cost.
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
    priority:
      name: Priority
      description: How soon it should happen compared with the rest of the build plan.
      default: normal
      selector:
        select:
          options:
            - high
            - normal
            - low
    tier:
      name: Tier
      description: Where it falls in the build order of its area. Leave empty to judge it from the plant (trees and shrubs, perennials or small plants).
      selector:
        select:
          options:
            - trees_shrubs
            - hardscape
            - perennials
            - small_plants
    not_before:
      name: Not before
      description: The earliest year it may be bought or done.
      selector:
        number:
          min: 2000
          max: 2200
          mode: box
    notes:
      name: Notes
      description: For a proposal, why this plant suits this spot.
      selector:
        text:
          multiline: true
    care_profile:
      name: Care profile
      description: The kind of upkeep it needs (pruning, feeding, mowing). Leave empty to let it be chosen from the plant's type.
      selector:
        select:
          options:
            - apple
            - azalea
            - blueberry
            - boxwood
            - conifer
            - deciduous_tree
            - hydrangea
            - japanese_maple
            - lavender
            - lawn
            - ornamental_grass
            - peach
            - perennial
            - pine
            - rose
            - spring_bulb
            - strawberry
            - wildflower_meadow

search_plants:
  name: Search plants
  description: Search the plant catalogue (OpenPlantDB) by name and by what a spot needs. Give search text, filters or both. Returns the ids to use with Add planting, with each plant's size, light and water needs and hardiness zones.
  fields:
    query:
      name: Search for
      description: Words in the common name, botanical name or id.
      example: japanese maple
      selector:
        text:
    sun:
      name: Sun
      selector:
        select:
          options:
            - full
            - partial
            - shade
    water:
      name: Water need
      selector:
        select:
          options:
            - low
            - moderate
            - high
    category:
      name: Category
      description: Trees, shrubs and ornamental perennials are all in flower.
      selector:
        select:
          options:
            - vegetable
            - herb
            - fruit
            - berry
            - flower
            - cover-crop
    plant_type:
      name: Type
      description: Words in the plant's type, e.g. evergreen shrub, fern, native perennial, conifer, ornamental grass, groundcover.
      example: evergreen shrub
      selector:
        text:
    min_height_in:
      name: Minimum height
      description: Keep plants that are at least this tall when mature.
      selector:
        number:
          min: 0
          max: 2000
          unit_of_measurement: in
          mode: box
    max_height_in:
      name: Maximum height
      description: Keep plants that stay under this height when mature.
      selector:
        number:
          min: 0
          max: 2000
          unit_of_measurement: in
          mode: box
    limit:
      name: Maximum results
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
    all_zones:
      name: Include plants not hardy here
      description: By default only plants suited to your hardiness zone are returned.
      default: false
      selector:
        boolean:

refresh_catalogue:
  name: Refresh plant catalogue
  description: Download the latest plant catalogue from OpenPlantDB now. This also happens when the integration is updated, and it is checked for changes weekly.

set_planting_status:
  name: Set planting status
  description: Accept a proposed planting into the build plan (planned) or plant it now (active), turn one down (removed), or report that a planting died or was removed. Making a proposed or planned planting active records it as bought today. Tasks stop for anything not active, and losses are kept as history.
  fields:
    planting_id:
      name: Planting ID
      description: From the List plantings action or the area's Plantings sensor.
      required: true
      selector:
        text:
    status:
      name: Status
      required: true
      selector:
        select:
          options:
            - active
            - planned
            - proposed
            - dead
            - removed
    notes:
      name: Notes
      description: What happened, e.g. "deer", "drowned in the wet corner".
      selector:
        text:
          multiline: true
    cost:
      name: Cost
      description: What it actually cost, when it is bought. Leave empty to count the estimated cost.
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box

add_task:
  name: Add task
  description: Add a one-off task or report a problem in an area, e.g. "Grass too long". Due today unless a date is given.
  fields:
    area:
      name: Garden area
      description: Area name or id.
      required: true
      selector:
        device:
          integration: master_gardener
    title:
      name: Title
      required: true
      example: Grass too long
      selector:
        text:
    due:
      name: Due
      selector:
        date:
    notes:
      name: Notes
      selector:
        text:
          multiline: true

list_plantings:
  name: List plantings
  description: Return recorded plantings with their ids, optionally for one area or one status (e.g. proposed, dead).
  fields:
    area:
      name: Garden area
      description: Area name or id.
      selector:
        device:
          integration: master_gardener
    status:
      name: Status
      selector:
        select:
          options:
            - active
            - planned
            - proposed
            - dead
            - removed

get_plan:
  name: Get build plan
  description: Return the multi-year build plan - every planned planting and project placed in a year by its area's build order (trees and shrubs, then hardscape, then perennials, then small plants), its priority and the annual budget, with what has been spent and what remains this year.

add_project:
  name: Add project
  description: Add work that is not a plant to the build plan, e.g. a path, a fence, raised beds or irrigation. It is placed in a year with the planned plantings and appears on the area's to-do list in its year.
  fields:
    area:
      name: Garden area
      description: Area name or id.
      required: true
      selector:
        device:
          integration: master_gardener
    name:
      name: Name
      description: What is to be done. Used as the to-do item.
      required: true
      example: Lay the flagstone path
      selector:
        text:
    estimated_cost:
      name: Estimated cost
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
    tier:
      name: Tier
      description: Where it falls in the build order of its area.
      default: hardscape
      selector:
        select:
          options:
            - trees_shrubs
            - hardscape
            - perennials
            - small_plants
    priority:
      name: Priority
      description: How soon it should happen compared with the rest of the build plan.
      default: normal
      selector:
        select:
          options:
            - high
            - normal
            - low
    not_before:
      name: Not before
      description: The earliest year it may be bought or done.
      selector:
        number:
          min: 2000
          max: 2200
          mode: box
    notes:
      name: Notes
      selector:
        text:
          multiline: true

set_project_status:
  name: Set project status
  description: Record a project as done (its cost counts against this year's budget), put it back in the plan, or drop it (removed).
  fields:
    project_id:
      name: Project ID
      description: From the Get build plan action.
      required: true
      selector:
        text:
    status:
      name: Status
      required: true
      selector:
        select:
          options:
            - planned
            - done
            - removed
    cost:
      name: Cost
      description: What it actually cost. Leave empty to count the estimated cost.
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
    notes:
      name: Notes
      selector:
        text:
          multiline: true

update_plan_item:
  name: Update plan item
  description: Change how a planned planting or project is placed in the build plan.
  fields:
    item_id:
      name: Item ID
      description: A planting or project id, from the Get build plan action.
      required: true
      selector:
        text:
    priority:
      name: Priority
      description: How soon it should happen compared with the rest of the build plan.
      selector:
        select:
          options:
            - high
            - normal
            - low
    tier:
      name: Tier
      description: Where it falls in the build order of its area.
      selector:
        select:
          options:
            - trees_shrubs
            - hardscape
            - perennials
            - small_plants
    not_before:
      name: Not before
      description: The earliest year it may be bought or done. 0 clears it.
      selector:
        number:
          min: 0
          max: 2200
          mode: box
    estimated_cost:
      name: Estimated cost
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
