add_planting:
  name: Add planting
  description: Record something growing (or planned) in a garden area. Plants found in the built-in catalog get their yearly tasks scheduled automatically.
  fields:
    area:
      name: Garden area
      description: The area it grows in.
      required: true
      selector:
        device:
          integration: master_gardener
    plant:
      name: Plant
      description: A plant id or exact name from the plant catalogue, e.g. tomato or cherokee-purple. Find ids with the Search plants action. A plant the catalogue does not know is tracked without automatic sowing and harvest tasks.
      required: true
      example: tomato
      selector:
        text:
    name:
      name: Name
      description: Your own name for it, e.g. the variety. Used in task titles.
      example: Cherokee Purple tomato
      selector:
        text:
    quantity:
      name: Quantity
      default: 1
      selector:
        number:
          min: 1
          max: 10000
          mode: box
    planted_on:
      name: Planted on
      description: When it went in the ground. Leave empty if it is only planned.
      selector:
        date:
    notes:
      name: Notes
      selector:
        text:
          multiline: true

    care_profile:
      name: Care profile
      description: The kind of upkeep it needs (pruning, feeding, mowing). Leave empty to let it be chosen from the plant's type.
      selector:
        select:
          options:
            - apple
            - azalea
            - blueberry
            - boxwood
            - conifer
            - deciduous_tree
            - hydrangea
            - japanese_maple
            - lavender
            - lawn
            - ornamental_grass
            - peach
            - perennial
            - pine
            - rose
            - spring_bulb
            - strawberry
            - wildflower_meadow

search_plants:
  name: Search plants
  description: Search the plant catalogue (OpenPlantDB) by common name, botanical name or id. Returns the ids to use with Add planting.
  fields:
    query:
      name: Search for
      required: true
      example: japanese maple
      selector:
        text:
    limit:
      name: Maximum results
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
    all_zones:
      name: Include plants not hardy here
      description: By default only plants suited to your hardiness zone are returned.
      default: false
      selector:
        boolean:

refresh_catalogue:
  name: Refresh plant catalogue
  description: Download the latest plant catalogue from OpenPlantDB now. This also happens when the integration is updated, and it is checked for changes weekly.

set_planting_status:
  name: Set planting status
  description: Report that a planting died or was removed (or bring it back). Its tasks stop, and the loss is kept as history.
  fields:
    planting_id:
      name: Planting ID
      description: From the area's Plantings sensor or the List plantings action.
      required: true
      selector:
        text:
    status:
      name: Status
      required: true
      selector:
        select:
          options:
            - active
            - dead
            - removed
    notes:
      name: Notes
      description: What happened, e.g. "deer", "drowned in the wet corner".
      selector:
        text:
          multiline: true

add_task:
  name: Add task
  description: Add a one-off task or report a problem in an area, e.g. "Grass too long". Due today unless a date is given.
  fields:
    area:
      name: Garden area
      required: true
      selector:
        device:
          integration: master_gardener
    title:
      name: Title
      required: true
      example: Grass too long
      selector:
        text:
    due:
      name: Due
      selector:
        date:
    notes:
      name: Notes
      selector:
        text:
          multiline: true

list_plantings:
  name: List plantings
  description: Return every recorded planting, optionally for one area.
  fields:
    area:
      name: Garden area
      selector:
        device:
          integration: master_gardener
