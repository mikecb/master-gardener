name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so breakage from a new Home Assistant or HACS rule shows up
    # even when nothing is being merged.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "$(grep '^ruff==' requirements-test.txt)"
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: Engine tests without Home Assistant imports
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: All tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand icons live in a separate Home Assistant repository.
          ignore: brands
